<div class="auth-wrapper">
  <div class="brand-side">
    <div class="logo-group animate-fade-in">
      <div class="logo-symbol"></div>
      <h2>Finance AI</h2>
    </div>
    <div class="brand-text animate-fade-in">
      <h3>Empieza hoy tu camino financiero.</h3>
      <p>Crea una cuenta en segundos y obtén un análisis predictivo completo de tus gastos y patrones de consumo.</p>
    </div>
  </div>

  <div class="form-side">
    <div class="glass-card auth-card animate-fade-in">
      <div class="card-header">
        <h2>Crear una Cuenta</h2>
        <p>Completa los detalles para comenzar</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label for="name">Nombre Completo</label>
          <input type="text" id="name" formControlName="name" placeholder="Tu nombre">
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" formControlName="email" placeholder="correo@ejemplo.com">
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" formControlName="password" placeholder="Mínimo 6 caracteres">
        </div>

        <button type="submit" class="btn btn-primary w-full" [disabled]="registerForm.invalid">
          Crear Cuenta
        </button>
      </form>

      <div class="card-footer">
        <p>¿Ya tienes una cuenta? <a routerLink="/login">Inicia Sesión aquí</a></p>
      </div>
    </div>
  </div>
</div>
