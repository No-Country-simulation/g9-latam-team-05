<div class="auth-wrapper">
  <div class="brand-side">
    <div class="logo-group animate-fade-in">
      <div class="logo-symbol"></div>
      <h2>Finance AI</h2>
    </div>

    <div class="illustration-container animate-fade-in">
      <img src="finance_illustration.png" alt="Finance AI Illustration" class="brand-illustration">
    </div>

    <div class="brand-text animate-fade-in">
      <h3>Monitorea. Clasifica. Ahorra.</h3>
      <p>Toma el control absoluto de tu salud financiera utilizando modelos avanzados de inteligencia artificial.</p>
    </div>
  </div>

  <div class="form-side">
    <div class="glass-card auth-card animate-fade-in">
      <div class="card-header">
        <h2>Bienvenido de nuevo</h2>
        <p>Ingresa tus datos para ingresar al portal</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" formControlName="email" placeholder="correo@ejemplo.com">
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" formControlName="password" placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary w-full">
          Iniciar Sesión
        </button>
      </form>

      <div class="card-footer">
        <p>¿No tienes una cuenta? <a routerLink="/register">Regístrate aquí</a></p>
      </div>
    </div>
  </div>
</div>
